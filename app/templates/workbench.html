<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ name }}</title><link rel="stylesheet" href="/static/ticket.css"><link rel="stylesheet" href="/static/paper.css" media="print"><script src="/static/dispatch.js" type="module"></script></head>
<body><div class="harbor"><aside class="rail"><a class="identity" href="/" aria-label="岛线余位清算台首页"><span class="flag" aria-hidden="true"></span><strong>南埠客运</strong></a><nav aria-label="航务导航"><a href="#sailings">船班档期</a><a href="#dispatch">换票与候补</a><a href="#evidence">订单证据</a><a href="#archive">值航留档</a></nav><span class="desk">码头值航席</span></aside>
<div class="workspace"><header class="topbar"><div><span class="stamp">南埠站 / 值航</span><h1>{{ name }}</h1></div><div class="toolbar"><label>样例 <select id="sample">{% for key,label in samples.items() %}<option value="{{ key }}" {% if key == 'dirty' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label class="import">导入清算单<input id="import" type="file" accept=".json,application/json"></label></div></header>
<main><div class="shift"><time id="shift"></time><strong id="balance" role="status">正在清算</strong></div><div class="kpis" id="totals"></div>
<div class="grid"><section class="panel sailing" id="sailings"><div class="panel__head"><h2>航线席位</h2><span>按船班与席位层级</span></div><div class="routes" id="routes"></div></section>
<section class="panel dispatch" id="dispatch"><div class="panel__head"><h2>换票与候补</h2><label>船班 <select id="trip"><option value="">全部船班</option></select></label></div><div class="columns"><div><h3>换票 / 退票</h3><div class="ledger" id="moves"></div></div><div><h3>候补递补</h3><div class="ledger" id="queue"></div></div></div></section>
<section class="panel" id="evidence"><div class="panel__head"><h2>订单证据</h2><label>查看 <select id="evidence-mode"><option value="issues">异常与重复</option><option value="events">回传顺序</option><option value="holds">到期保留</option></select></label></div><div class="ledger" id="event-ledger"></div></section>
<section class="panel closure" id="archive"><div class="panel__head"><h2>值航留档</h2></div><form id="archive-form"><label>值航员 <input id="operator" required maxlength="32" placeholder="输入值航员"></label><button type="submit">留档清算单</button></form><p id="archive-feedback" role="status"></p><div id="archive-actions" hidden><button id="rerun" type="button">复跑清算</button><a id="download">下载航务凭证</a></div></section></div></main>
<footer class="statusbar"><span>南埠站 · 东八区</span><a href="/docs">规则 {{ version }} · 接口</a></footer></div></div></body></html>
